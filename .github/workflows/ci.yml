name: Sgancia checks
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  git-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_git_secrets.py --all
      - run: python3 scripts/test_git_guard.py
      - run: python3 scripts/sync_user_guide.py --check
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sgancia
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sgancia_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U sgancia" --health-interval 5s --health-retries 10
    env:
      SGANCIA_TEST_DATABASE_URL: postgresql+psycopg://sgancia:ci-only-password@localhost:5432/sgancia_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: pip install -r requirements-dev.lock
      - run: pytest -q
      - run: python ../scripts/export_reference.py --check
      - run: SGANCIA_DATABASE_URL="$SGANCIA_TEST_DATABASE_URL" alembic upgrade head
      - run: SGANCIA_DATABASE_URL="$SGANCIA_TEST_DATABASE_URL" alembic check
      - run: SGANCIA_DATABASE_URL="$SGANCIA_TEST_DATABASE_URL" alembic downgrade base
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm --prefix frontend ci
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: docker build -t sgancia:local .
      - run: python3 scripts/run_browser_qa.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-qa, path: .local/release-qa/}
